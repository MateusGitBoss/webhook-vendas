services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vendas
    ports: ["5432:5432"]
    volumes: [dados:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@banco:5432/vendas
    ports: ["8000:8000"]
    depends_on:
      banco: { condition: service_healthy }

volumes:
  dados:
